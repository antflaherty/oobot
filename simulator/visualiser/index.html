<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oobot visualiser — MVP</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #e2e8f0;
      color: #1e293b;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    canvas {
      background: #f8fafc;
      border: 2px solid #0f172a;
      display: block;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
    }
    .hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>oobot visualiser — MVP (live sim with fallback)</h1>
  <canvas id="viz" width="800" height="600"></canvas>
  <p class="hint">
    Connects to the sim's live WebSocket channel and renders <code>worldSnapshot</code>
    messages with hold-last-frame + interpolate-to-next (&bull; no extrapolation).
    If no sim is connected, a hardcoded fallback demo plays instead.
  </p>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
